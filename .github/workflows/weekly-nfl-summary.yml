name: Weekly NFL comparison refresh

on:
  schedule:
    # Thursday, after nflverse's Wednesday-night stat corrections.
    - cron: '23 10 * * 4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-nfl-summary
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run refresh:nfl
      - name: Publish verified snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/nfl-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh NFL comparison snapshot [skip ci]'
          git push origin HEAD:${{ github.event.repository.default_branch }}
